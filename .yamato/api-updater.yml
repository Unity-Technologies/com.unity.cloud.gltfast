# Hand-authored (not Recipe-generated).
# Verifies that the 7.0 assembly/namespace rename auto-migrates consumer code through Unity's
# API Updater, by running Projects/ApiUpdaterMigration/Tools/verify-apiupdater.sh on CI.
api_updater:
  name: API Updater Migration
  agent:
    image: package-ci/ubuntu-22.04:v4
    type: Unity::VM
    flavor: b1.large
  commands:
  # One block: Yamato runs each command in a fresh shell, so the PATH the CLI installer sets would not
  # survive into a later step (see code_format_recipes).
  - name: Verify API Updater migration
    command: |-
      set -eu

      . Tools/CI/unity-cli.sh
      install_unity_editor Projects/ApiUpdaterMigration

      Projects/ApiUpdaterMigration/Tools/verify-apiupdater.sh
