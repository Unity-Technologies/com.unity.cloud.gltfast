# This workflow was adapted from com.unity.memoryprofiler
name: 'dotnet-format'
description: 'Format code using dotnet format'
inputs:
  project:
    description: 'Project to format'
    required: false
    default: 'glTFast-Test'
  script:
    description: 'A script to run to autoformat'
    required: false
    default: ''
  gitUserEmail:
    description: "The committer's email for the patch"
    required: false
    default: 'github-actions[bot]@users.noreply.github.com'
  gitUserName:
    description: "The committer's name for the patch"
    required: false
    default: 'github-actions[bot]'
  gitBranch:
    description: "The branch to commit to"
    required: false
    default: ''
  gitCommitMessage:
    description: 'The commit message to use for the patch'
    required: false
    default: 'formatted source code'
  onlyFilesModifiedInPullRequest:
    description: 'Only format files that were changed in the pull request'
    required: false
    default: false
  dotnetExecutable:
    description: 'The path to the "dotnet" executable to use'
    required: false
    default: 'dotnet'
  workingDirectory:
    description: 'The working directory when formatting using "dotnet format". This does not apply when using a custom script.'
    required: false
    default: '..'
  checkoutSource:
    description: 'Whether the source code should be checked out or not (disable if checked out before running this task)'
    required: false
    default: true
  repoToken:
    description: 'A github token to use for pushing changes, pass in secrets.GITHUB_TOKEN.'
    required: true
    default: ''
  unityLicenseKey:
    description: '(Not currently needed as this is handled via upm-ci, which may be overkill but is definitely easier) A github token to use for pushing changes, pass in secrets.UNITY_LICENSE after generating one on Genesis with Asset Server/Teams capabilities, and maybe Clustered Rendering for the "com.unity.editor.headless" flag.'
    required: false
    default: ''
  alsoFormatWhitespace:
    description: 'Whether or not the folder should also receive whitespace formatting.'
    required: false
    default: false
  unityVersion:
    description: 'Which Unity version to use for generating project solutions.'
    required: false
    default: '6000.0'

permissions:
  contents: write
  pull-requests: read

runs:
  using: "composite"
  steps:
    - name: 'Checkout repo'
      uses: actions/checkout@v6
      if: ${{ inputs.checkoutSource }}
      with:
        fetch-depth: 0
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}

    # Cache each test project's Library folder. The dominant cost of the "RegenerateProjectFiles"
    # editor launch below is a cold asset import + script compile + domain reload; a warm Library
    # lets the editor reuse that work and open quickly. The key is the editor version plus the
    # projects' resolved package sets (packages-lock.json) -- Unity reimports whatever changed on
    # top of a restored Library, so even a near-match (the restore-keys prefix fallback) is a big
    # win. We do NOT cache the downloaded editor: unity-downloader-cli pulls it from internal
    # artifactory fast enough that restoring multiple GB from the Actions cache wouldn't pay off.
    - name: 'Cache Unity project Library folders'
      if: ${{ inputs.project != '' }}
      uses: actions/cache@v5
      with:
        path: |
          Projects/${{ inputs.project }}/Library
          Projects/${{ inputs.project }}/ProjectSettings/*.asset
        key: unity-library-${{ runner.os }}-${{ inputs.unityVersion }}-${{ inputs.project }}-${{ hashFiles(format('Projects/{0}/Packages/manifest.json', inputs.project)) }}
        restore-keys: |
          unity-library-${{ runner.os }}-${{ inputs.unityVersion }}-${{ inputs.project }}-

    - id: dotnet-format
      name: 'dotnet format code'
      shell: bash
      # Only push when:
      # - not a PR from a fork, or
      # - using pull_request_target with a minimal permission token and strict checks
      if: >
        (github.event_name != 'pull_request') ||
        (github.event.pull_request.head.repo.full_name == github.repository)
      run: |
        set -exo pipefail

        SCRIPT="${{ inputs.script }}"
        PROJECT="${{ inputs.project }}"
        DOTNET="${{ inputs.dotnetExecutable }}"
        WORKING_DIRECTORY="${{ inputs.workingDirectory }}"
        BRANCH="${{ inputs.gitBranch || github.head_ref || github.ref_name }}"
        UNITY_LICENSE="${{ inputs.unityLicenseKey }}"
        UNITY_VERSION="${{ inputs.unityVersion }}"

        # turn off xtrace before touching secrets
        set +x
        GITHUB_TOKEN="${{ inputs.repoToken }}"
        if test -z "$GITHUB_TOKEN"; then
          echo "Missing repo token!"
        fi
        # Use token in remote URL; x-access-token is the username for GitHub tokens
        git config --global credential.helper store  # or os-specific helper (manager-core on Windows, libsecret on Linux)
        git credential approve <<'EOF'
        protocol=https
        host=github.cds.internal.unity3d.com
        username=x-access-token
        password=${GITHUB_TOKEN}
        EOF
        set -x

        git remote set-url origin "https://github.cds.internal.unity3d.com/${{ github.repository }}.git"

        git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
        git checkout -B "${BRANCH}" "origin/${BRANCH}" || git checkout -B "${BRANCH}"
        git pull --ff-only

        WHITSPACE_FORMAT_RAN=

        if test -n "$SCRIPT"; then
          echo "Executing $SCRIPT..."
          $SCRIPT
        elif [[ ! -z $PROJECT ]]; then
          # Otherwise work with the project that was given to us.
          # But first...

          # Install VS Code which is used to regenerate the Project Files
          # Add Microsoft GPG key (once)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/keyrings/packages.microsoft.gpg
          sudo chmod 0644 /etc/apt/keyrings/packages.microsoft.gpg

          # Add the VS Code repository
          echo "deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list

          # Update package lists
          sudo apt-get update

          # Install VS Code (stable)
          sudo apt-get install -y code

          # Install virtual X, which is needed to open Unity via upm-ci
          sudo apt-get install -y xvfb

          # Install upm-ci via npm. upm-ci is needed to get Unity set up with a valid license:
          # the standalone editor/UTR launch on its own fails with "No ULF license found", whereas
          # upm-ci performs the licensing handshake correctly.
          sudo apt-get install -y npm
          sudo npm install -g upm-ci-utils@stable --registry https://artifactory.prd.it.unity3d.com/artifactory/api/npm/upm-npm

          # Download Unity so the Project solutions can be build
          pip install unity-downloader-cli --user --upgrade --index-url https://artifactory.prd.it.unity3d.com/artifactory/api/pypi/pypi/simple
          sudo apt -y install liblz4-tool
          unity-downloader-cli -u "$UNITY_VERSION" -c editor --wait --fast

          # Set workspace root
          DIR=$(pwd)

          # Find the Unity binary (Linux)
          UNITY_BIN="$DIR/.Editor/Unity"
          if [ ! -x "$UNITY_BIN" ]; then
            UNITY_BIN="$DIR/.Editor/Unity/Editor/Unity"
          fi
          if [ ! -x "$UNITY_BIN" ]; then
            UNITY_BIN="$DIR/.Editor/Editor/Unity"
          fi
          if [ ! -x "$UNITY_BIN" ]; then
            echo "Could not locate Unity editor binary under .Editor"; ls -R "$DIR/.Editor"; exit 1;
          fi

          # Activate the Unity License (Not happening this way for now because it'd require creating a Unity ID to register the license with. Activating a license via upm-ci is easier
          # turn off xtrace before touching secrets
          # set +x
          # "$UNITY_BIN" \
            # -batchmode \
            # -nographics \
            # -quit \
            # -executeMethod "Packages.Rider.Editor.RiderScriptEditor.SyncSolution" \
            # -serial "$UNITY_LICENSE" \
            # -username 'name@example.com' \
            # -password 'XXXXXXXXXXXXX' \
            # -logFile -
          # set -x

          # Optional: add to PATH
          export PATH="$(dirname "$UNITY_BIN"):$PATH"

          # ... NOW process the project, open it, regenerate its solution and format it
          pushd .
          cd "$WORKING_DIRECTORY"
          UNITY_PROJECT="$DIR/Projects/$PROJECT"
          SLN="$UNITY_PROJECT/$PROJECT.sln"

          # Start Unity once via upm-ci to activate the license. The direct editor launches
          # below can't acquire a license on their own (they fail with "No ULF license found");
          # upm-ci performs the licensing handshake, and the lease it establishes is reused by
          # the subsequent direct launches in this job.
          #
          # We run a no-op test pass (a filter that matches nothing, plus --zero-tests-are-ok)
          # purely as the vehicle for that licensing handshake. "--platform editmode" is the key
          # detail: without it, upm-ci's package-tests pass hands UTR BOTH "--suite=editor" and
          # "--suite=playmode" in one invocation, which UTR 2.0.0+ rejects ("Multiple --suite
          # options are no longer supported"). "--platform editmode" runs editmode tests only, so
          # upm-ci passes a single "--suite=editor". (See upm-ci docs: project test --platform.)
          upm-ci project pack --project-path "$UNITY_PROJECT"
          xvfb-run -a upm-ci project test -u "$UNITY_BIN" --project-path "$UNITY_PROJECT" --type package-tests --platform editmode --extra-utr-arg="--testfilter=DoesNotExistOnPurpose --zero-tests-are-ok=1" --extra-editor-arg nographics

          # Open and quit; this triggers import and project files generation. This is also calling a method to regenerate the solution file.
          "$UNITY_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$UNITY_PROJECT" \
            -executeMethod "Packages.Rider.Editor.RiderScriptEditor.SyncSolution" \
            -logFile -
          "$DOTNET" restore "$SLN"
          "$DOTNET" format "$SLN"
          # release the license again (not needed as long as licensing is handled by upm-ci
          # "$UNITY_BIN" -quit -batchmode -returnlicense
          popd
        else
          # format the whole repository if neither a script nor a project were specified.
          DIR=$(pwd)
          pushd .
          cd "$WORKING_DIRECTORY"
          "$DOTNET" format whitespace --folder "$DIR"
          popd
          WHITSPACE_FORMAT_RAN=1
        fi

        if ${{ inputs.alsoFormatWhitespace }}; then
          if test -z "$NO_FORMATTING"; then
            # format the whole repository if it wasn't formatted yet but was requested.
            DIR=$(pwd)
            pushd .
            cd "$WORKING_DIRECTORY"
            "$DOTNET" format whitespace --folder "$DIR"
            popd
            WHITSPACE_FORMAT_RAN=1
          fi
        fi

        # shut down any build servers we may have started.
        "$DOTNET" build-server shutdown || true

        NO_FORMATTING=
        if git diff --exit-code >/dev/null; then
          echo "No code formatting occurred"
          NO_FORMATTING=1
        else
          git config set advice.addIgnoredFile false
          # If formatting occurred and the onlyFilesModifiedInPullRequest is true, filter out only the files changed as part of the PR to be added to the commit, otherwise add all changed files.
          if ${{ inputs.onlyFilesModifiedInPullRequest }}; then
            pwd
            ls -la
            BASE_REF=${{ github.event.pull_request.base.sha }}
            HEAD_REF=${{ github.event.pull_request.head.sha }}
            git diff --diff-filter=d "${BASE_REF}...${HEAD_REF}" --name-only || true
            while IFS= read -r -d $'\0' file; do
                if test -f "$file"; then
                  git add -- "$file"
                fi
            done < <(git diff --diff-filter=d "${BASE_REF}...${HEAD_REF}" --name-only -z)
            if git diff --staged --exit-code >/dev/null; then
              echo "No code formatting occurred"
              NO_FORMATTING=1
            fi
          else
            git add -- .
          fi
        fi

        # Only create a commit if any changes occurred
        if test -z "$NO_FORMATTING"; then
          if test -n "${{ inputs.gitUserEmail }}"; then
            git config --global user.email "${{ inputs.gitUserEmail }}"
          fi
          if test -n "${{ inputs.gitUserName }}"; then
            git config --global user.name "${{ inputs.gitUserName }}"
          fi

          # Stage and commit only if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "${{ inputs.gitCommitMessage }}"
            # Push (fully qualified ref)
            git push origin HEAD:refs/heads/"${BRANCH}"
          else
            echo "No changes to commit"
          fi
        fi

    # Upload the editor logs as an artifact. The direct "RegenerateProjectFiles" launch already
    # streams to stdout via "-logFile -", but the upm-ci license warm-up writes its editor log
    # under upm-ci~/ where it would otherwise be lost. "if: always()" so the logs survive a failed
    # run -- which is exactly when they're needed.
    # NOTE: must stay on @v3. This repo runs on GitHub Enterprise Server (github.cds.internal.unity3d.com),
    # and upload-artifact@v4+ (built on @actions/artifact v2) is not supported on GHES
    # ("GHESNotSupportedError"). v3 uses the GHES-compatible artifact v1 and takes the same inputs.
    - name: 'Upload Unity logs'
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: unity-logs
        path: |
          upm-ci~/test-results/**
          upm-ci~/temp/*/Logs/**
          upm-ci~/temp/*/*.log
          upm-ci~/**/*.log
          **/UnityLog.txt
        if-no-files-found: ignore
        retention-days: 7
